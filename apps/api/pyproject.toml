[tool.pytest.ini_options]
testpaths = ["tests", "../../tests/tooling"]
pythonpath = [".", "../.."]
addopts = "-ra"
markers = ["integration: requires a disposable PostgreSQL TEST_DATABASE_URL", "ssh: requires an explicitly configured disposable SSH host", "compose: requires a running disposable Compose stack"]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".tools", ".data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
