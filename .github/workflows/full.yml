name: Full local-stack checks
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compose-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.13.0'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.25.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-failures
          path: |
            playwright-report/
            test-results/
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 3
      - if: always()
        run: pnpm stack:down
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r scripts/deploy/requirements.txt pytest==8.4.2 PyYAML==6.0.3
      - run: python -m pytest -c apps/api/pyproject.toml tests/tooling -q
